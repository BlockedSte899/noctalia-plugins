# Nix config generator for Noctalia.
# Generates a Nix attribute set from the merged Noctalia configuration.

id = "blockedste899/nix-config-generator"
name = "Nix config generator"
version = "0.1.3"
plugin_api = 43
author = "BlockedSte899"
license = "MIT"
icon = "file-code"
description = "Mirrors your Noctalia config into a Nix file automatically, except the settings you choose to keep manual."
tags = ["service", "shortcut", "nixos", "utility"]
dependencies = ["nix", "coreutils"]

[[setting]]
key = "target_path"
type = "file"
label_key = "settings.target_path.label"
description_key = "settings.target_path.description"
default = "~/.config/noctalia/nix-config-generator.nix"
extensions = [".nix"]

[[setting]]
key = "exclude_paths"
type = "string_list"
label_key = "settings.exclude_paths.label"
description_key = "settings.exclude_paths.description"
default = [ "calendar.account" ]

[[setting]]
key = "rewrite_paths"
type = "bool"
label_key = "settings.rewrite_paths.label"
description_key = "settings.rewrite_paths.description"
default = false

[[setting]]
key = "path_prefix_from"
type = "string"
label_key = "settings.path_prefix_from.label"
description_key = "settings.path_prefix_from.description"
default = "~"

[[setting]]
key = "path_prefix_to"
type = "string"
label_key = "settings.path_prefix_to.label"
description_key = "settings.path_prefix_to.description"
default = "~"

[[setting]]
key = "export_mode"
type = "select"
label_key = "settings.export_mode.label"
description_key = "settings.export_mode.description"
default = "merged"
options = [
  { value = "merged", label_key = "settings.export_mode.options.merged" },
  { value = "full", label_key = "settings.export_mode.options.full" },
]

[[shortcut]]
id = "export"
entry = "shortcut.luau"

[[service]]
id = "service"
entry = "service.luau"
